name: confirmar
on:
  workflow_dispatch:
    inputs:
      job: { description: "id (criado pelo Worker)", required: true }
      origem: { required: true }
      destino: { required: true }
      pares: { description: "ida|volta,ida|volta (até 4; volta vazia = só ida)", required: true }
      runner: { description: "executor em JSON (o Worker escolhe: PC do Rafael ou nuvem)", required: false, default: '"ubuntu-latest"' }

permissions:
  contents: read

jobs:
  confirmar:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      JOB: ${{ inputs.job }}
      ORIGEM: ${{ inputs.origem }}
      DESTINO: ${{ inputs.destino }}
      PARES: ${{ inputs.pares }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        run: node scan/cli.mjs confirmar-pares "$JOB" "$ORIGEM" "$DESTINO" "$PARES"
      - if: failure()
        shell: bash
        run: node scan/cli.mjs etapa "$JOB" erro
