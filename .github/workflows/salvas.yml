name: salvas
on:
  workflow_dispatch:
    inputs:
      origens: { description: "origens em JSON (padrão: todas as de rotas.json)", required: false, default: '["SAO","GRU","CGH","VCP"]' }

permissions:
  contents: read

# Roda no executor hospedado do GitHub (desde 2026-11-27; antes ficava no PC do Rafael). Uma origem por vez, para ler
# o Google devagar; a rodada mais nova cancela a anterior para não acumular dias.
concurrency:
  group: salvas-${{ inputs.origens }}
  cancel-in-progress: true

jobs:
  salvas:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        origem: ${{ fromJSON(inputs.origens) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        run: |
          # Edge no lugar do Chrome (mesmo preço do PC no teste de 27/11/2026).
          command -v microsoft-edge >/dev/null || {
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-edge.gpg >/dev/null
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list >/dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq microsoft-edge-stable >/dev/null
          }
          echo "CHROME_BIN=microsoft-edge" >> "$GITHUB_ENV"
      - shell: bash
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          ORIGEM: ${{ matrix.origem }}
        run: node scan/cli.mjs salvas "$ORIGEM"
