name: buscar
on:
  workflow_dispatch:
    inputs:
      job: { description: "id da busca (criado pelo Worker)", required: true }
      origem: { required: true }
      destino: { required: true }
      dias: { required: true, default: "20" }
      margem: { required: true, default: "0" }
      runner: { description: "executor em JSON (o Worker escolhe: PC do Rafael ou nuvem)", required: false, default: '"ubuntu-latest"' }

permissions:
  contents: read

# Busca inteira num job só (menos espera entre jobs): ida e volta em paralelo, pares em memória e confirmações em paralelo.
jobs:
  buscar:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      JOB: ${{ inputs.job }}
      ORIGEM: ${{ inputs.origem }}
      DESTINO: ${{ inputs.destino }}
      DIAS: ${{ inputs.dias }}
      MARGEM: ${{ inputs.margem }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          # Edge no lugar do Chrome: em 27/11/2026, 5 de 5 rotas lidas no GitHub (IP dos EUA) deram o mesmo preço do PC; o Chrome lia mais caro.
          command -v microsoft-edge >/dev/null || {
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-edge.gpg >/dev/null
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list >/dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq microsoft-edge-stable >/dev/null
          }
          echo "CHROME_BIN=microsoft-edge" >> "$GITHUB_ENV"
      - shell: bash
        run: node scan/cli.mjs buscar "$JOB" "$ORIGEM" "$DESTINO" "$DIAS" "$MARGEM"
      - if: failure()
        shell: bash
        run: node scan/cli.mjs etapa "$JOB" erro
