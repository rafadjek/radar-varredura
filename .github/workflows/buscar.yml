name: buscar
on:
  workflow_dispatch:
    inputs:
      job: { description: "id da busca (criado pelo Worker)", required: true }
      origem: { required: true }
      destino: { required: true }
      dias: { required: true, default: "20" }
      margem: { required: true, default: "0" }
      runner: { description: "executor em JSON (o Worker escolhe: PC do Rafael ou nuvem)", required: false, default: '"ubuntu-latest"' }

permissions:
  contents: read

# Busca inteira num job só (menos espera entre jobs): ida e volta em paralelo, pares em memória e confirmações em paralelo.
jobs:
  buscar:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      JOB: ${{ inputs.job }}
      ORIGEM: ${{ inputs.origem }}
      DESTINO: ${{ inputs.destino }}
      DIAS: ${{ inputs.dias }}
      MARGEM: ${{ inputs.margem }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        run: node scan/cli.mjs buscar "$JOB" "$ORIGEM" "$DESTINO" "$DIAS" "$MARGEM"
      - if: failure()
        shell: bash
        run: node scan/cli.mjs etapa "$JOB" erro
