name: buscar
on:
  workflow_dispatch:
    inputs:
      job: { description: "id da busca (criado pelo Worker)", required: true }
      origem: { required: true }
      destino: { required: true }
      dias: { required: true, default: "20" }
      margem: { required: true, default: "0" }
      runner: { description: "executor em JSON (o Worker escolhe: PC do Rafael ou nuvem)", required: false, default: '"ubuntu-latest"' }

permissions:
  contents: read

jobs:
  ida:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          JOB: ${{ inputs.job }}
          ORIGEM: ${{ inputs.origem }}
          DESTINO: ${{ inputs.destino }}
        run: node scan/cli.mjs calendario "$JOB" "$ORIGEM" "$DESTINO" ida ida.json
      - uses: actions/upload-artifact@v4
        with: { name: ida, path: ida.json }

  volta:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          JOB: ${{ inputs.job }}
          ORIGEM: ${{ inputs.origem }}
          DESTINO: ${{ inputs.destino }}
        run: node scan/cli.mjs calendario "$JOB" "$ORIGEM" "$DESTINO" volta volta.json
      - uses: actions/upload-artifact@v4
        with: { name: volta, path: volta.json }

  pares:
    needs: [ida, volta]
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 3
    outputs:
      tem: ${{ steps.p.outputs.tem }}
      matriz: ${{ steps.p.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: ida }
      - uses: actions/download-artifact@v4
        with: { name: volta }
      - id: p
        shell: bash
        env:
          DIAS: ${{ inputs.dias }}
          MARGEM: ${{ inputs.margem }}
        run: node scan/cli.mjs pares "$DIAS" "$MARGEM" ida.json volta.json

  confirmar:
    needs: pares
    if: needs.pares.outputs.tem == 'true'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pares.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          JOB: ${{ inputs.job }}
          ORIGEM: ${{ inputs.origem }}
          DESTINO: ${{ inputs.destino }}
          IDA: ${{ matrix.ida }}
          VOLTA: ${{ matrix.volta }}
        run: node scan/cli.mjs confirmar "$JOB" "$ORIGEM" "$DESTINO" "$IDA" "$VOLTA"

  fim:
    needs: [ida, volta, confirmar]
    if: always()
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          JOB: ${{ inputs.job }}
          RESULTADO: ${{ (needs.ida.result == 'success' && needs.volta.result == 'success') && 'pronto' || 'erro' }}
        run: node scan/cli.mjs etapa "$JOB" "$RESULTADO"
